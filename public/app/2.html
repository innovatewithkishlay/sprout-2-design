<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprout app · Mobile number</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body class="app">
<nav class="proto-bar" aria-label="Prototype">
<a href="../index.html">← Homepage</a>
<div class="proto-dots"><a href="1.html">1</a><a href="2.html" aria-current="page">2</a><a href="3.html">3</a><a href="4.html">4</a><a href="5.html">5</a></div>
<span>App onboarding prototype</span>
</nav>
<main class="phone">
<div class="screen">
<div class="topbar">
<a class="back" href="1.html" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10261C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<span class="step-label">Step 1 of 4 · Mobile</span>
<svg width="40" height="40" viewBox="0 0 64 64" role="img" aria-label="Ankur, seed stage"><ellipse cx="32" cy="46" rx="8" ry="6" fill="#F2B33D"/><path d="M10 52 Q32 46 54 52" fill="none" stroke="#0F3D2E" stroke-width="3.5" stroke-linecap="round"/></svg>
</div>
<div class="bar" aria-hidden="true" style="margin-top:6px"><span class="on"></span><span></span><span></span><span></span></div>

<h1 class="scr-h1">Your mobile number</h1>
<p class="scr-sub" style="margin-bottom:22px">Use the one linked to your Aadhaar. We'll send a 6-digit code.</p>

<label class="field-label" for="mob">Mobile number</label>
<div style="display:flex;align-items:stretch;min-height:56px;border:2px solid #1E7A45;border-radius:14px;overflow:hidden">
<span style="padding:0 14px;font-size:18px;font-weight:600;color:#4B5C53;border-right:1px solid #D6E2DA;display:flex;align-items:center">+91</span>
<input id="mob" type="tel" inputmode="numeric" value="98765 43210" style="flex:1;min-width:0;border:0;outline:none;padding:0 14px;font-family:inherit;font-size:20px;font-weight:500;color:#10261C">
</div>
<div style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:14px;color:#1E7A45;font-weight:500"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E7A45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Code sent</div>

<fieldset style="margin-top:24px">
<legend class="field-label" style="margin-bottom:8px">Enter the 6-digit code</legend>
<div class="otp">
<input aria-label="Digit 1" inputmode="numeric" maxlength="1" value="4">
<input aria-label="Digit 2" inputmode="numeric" maxlength="1" value="8">
<input aria-label="Digit 3" inputmode="numeric" maxlength="1" value="2">
<input aria-label="Digit 4" inputmode="numeric" maxlength="1">
<input aria-label="Digit 5" inputmode="numeric" maxlength="1">
<input aria-label="Digit 6" inputmode="numeric" maxlength="1">
</div>
</fieldset>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
<span class="muted" style="font-size:14px">Didn't get it? Resend in <span id="t">0:24</span></span>
<a class="tap" href="#edit" style="font-size:15px;font-weight:600;text-decoration:none">Change number</a>
</div>

<div class="spacer"></div>
<div class="note"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F3D2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:2px"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Your number is used only to sign in and for KYC.</div>
<a class="btn btn-primary btn-block" href="3.html" style="margin-top:10px">Verify code</a>
</div>
</main>
<script>
(function(){
  var inputs=document.querySelectorAll('.otp input');
  inputs.forEach(function(inp,i){inp.addEventListener('input',function(){if(inp.value&&inputs[i+1])inputs[i+1].focus()})});
  var s=24,t=document.getElementById('t');
  var iv=setInterval(function(){s--;if(s<=0){clearInterval(iv);t.parentNode.innerHTML='<a href="#resend" style="font-weight:600">Resend code</a>';return;}t.textContent='0:'+(s<10?'0'+s:s)},1000);
})();
</script>
</body>
</html>
